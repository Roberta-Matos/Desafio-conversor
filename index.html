<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Serif:ital,opsz,wdth,wght,GRAD@0,8..144,50..150,100..900,-50..100;1,8..144,50..150,100..900,-50..100&family=Roboto:ital,wght@1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>DevClub Convert-Money</title>
  </head>

  <body>
    <img class="logo" src="./assets/logo (1).gif" alt="logo-devclub-convert-money" />
    <main>
      <label>
        Converter <b>de</b>
        <select>
          <option>R$ Real Brasileiro</option>
        </select>
      </label>
      <label>
        Converter <b>para</b>
        <select class="currency-select">
          <option value="dolar">US$ Dólar americano</option>
          <option value="euro">€ Euro</option>
          <option value="libra">£ Libra</option>
        </select>
      </label>
      <label>
        Valor
        <input class="input-currency" placeholder="R$ 10.000,00" />
      </label>
      <button class="convert-button">Converter</button>
      <section>
        <div class="currency-box">
          <img src="./assets/real brasileiro.png" alt="logo-real-brasileiro" />
          <p class="currency">Real</p>
          <p class="currency-value-to-convert">R$ 0,00</p>
        </div>
        <div>
          <img class="arrow-img" src="./assets/arrow.png" alt="seta" />
        </div>

        <div class="currency-box">
          <img class="currency-image" src="./assets/usa.png" alt="logo-moeda-convertida" />
          <p class="currency" id="currency-name">Dólar</p>
          <p class="currency-value">US$ 0.0</p>
        </div>
      </section>
    </main>
  </body>
  <script src="./script.js"></script>
</html>
